name: EA8300 25.12 - Fast Image Builder

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # Versión oficial de OpenWrt 25.12.0 para ipq40xx/generic
  IB_URL: https://downloads.openwrt.org/releases/25.12.0/targets/ipq40xx/generic/openwrt-imagebuilder-25.12.0-ipq40xx-generic.Linux-x86_64.tar.xz
  IB_DIR: openwrt-imagebuilder-25.12.0-ipq40xx-generic.Linux-x86_64
  # TU LISTA DE PAQUETES:
  PACKAGES: "apk-mbedtls ath10k-board-qca4019 -ath10k-firmware-qca4019-ct base-files ca-bundle -dnsmasq dropbear firewall4 fstools -kmod-ath10k-ct kmod-gpio-button-hotplug kmod-leds-gpio kmod-nft-offload kmod-usb-dwc3 kmod-usb-dwc3-qcom kmod-usb3 libc libgcc libustream-mbedtls logd mtd netifd nftables odhcp6c odhcpd-ipv6only ppp ppp-mod-pppoe procd-ujail uboot-envtools uci uclient-fetch urandom-seed urngd -wpad-basic-mbedtls -ath10k-firmware-qca9888-ct kmod-usb-ledtrig-usbport luci luci-app-attendedsysupgrade batctl-full dawn dnsmasq-full kmod-batman-adv luci-app-dawn luci-proto-batman-adv mosquitto-nossl mosquitto-client-nossl libmosquitto-nossl opennds wpad-mbedtls kmod-ath10k ath10k-firmware-qca4019 ath10k-firmware-qca9888"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev libssl-dev zlib1g-dev gawk wget gettext python3 rsync file
          sudo timedatectl set-timezone "America/Buenos_Aires"

      - name: Download & Extract Image Builder
        run: |
          wget -q $IB_URL
          tar -xJf *.tar.xz
          mv $IB_DIR ib
          echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

      - name: Fast Build Firmware (IB)
        id: compile
        run: |
          cd ib
          # Convertimos los '-' en '^' para que el Image Builder entienda que debe quitar esos paquetes
          PACKAGES_IB=$(echo "$PACKAGES" | sed 's/ -/ ^/g')
          
          # Si tenés una carpeta llamada 'files' en tu repo, se inyectará la configuración automáticamente
          EXTRA_FILES=""
          if [ -d "../files" ]; then
            EXTRA_FILES="FILES=../files"
          fi

          echo "Iniciando compilación para Linksys EA8300..."
          make image PROFILE="linksys_ea8300" PACKAGES="$PACKAGES_IB" $EXTRA_FILES V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Organize files
        id: organize
        if: steps.compile.outputs.status == 'success'
        run: |
          cd ib/bin/targets/ipq40xx/generic/
          # Limpiamos archivos que no son la imagen final
          rm -rf packages sha256sums config.buildinfo feeds.buildinfo version.buildinfo
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success'
        with:
          name: OpenWrt_EA8300_25.12_${{ env.FILE_DATE }}
          path: ${{ env.FIRMWARE }}/*.bin

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: steps.organize.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: EA8300_25.12_${{ env.FILE_DATE }}
          files: ${{ env.FIRMWARE }}/*.bin
          body: |
            Build realizado con Image Builder Kit (Rápido).
            - Dispositivo: Linksys EA8300
            - Versión: OpenWrt 25.12.0
            - Malla: B.A.T.M.A.N. Adv
            - Roaming: DAWN
